<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manav Utsarjan - 25Q Test - Class 10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f3efe6;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:12px;min-height:100vh}
.container{max-width:520px;width:100%;background:#fff;border:3px solid #5d4037;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.header{background:linear-gradient(135deg,#3e2723,#5d4037);color:#ffecb3;padding:20px;text-align:center}
.header h2{font-size:20px;margin-bottom:5px}
.badge{background:#ffca28;color:#000;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block;margin-top:8px}
.screen{padding:22px;text-align:center}
.btn{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;border:none;padding:14px 20px;width:100%;border-radius:30px;font-weight:700;font-size:15px;cursor:pointer;margin-top:15px}
.progress{height:7px;background:#efebe9;width:100%}.fill{height:100%;background:#2e7d32;width:4%;transition:0.3s}
.topbar{display:flex;justify-content:space-between;padding:12px 15px;background:#efebe9;font-weight:700;font-size:14px}
.timer{background:#3e2723;color:#fff;padding:5px 14px;border-radius:20px}
.qtext{font-weight:700;text-align:left;font-size:16px;margin-bottom:14px;color:#3e2723;line-height:1.4}
.opt label{display:block;border:2px solid #bcaaa4;padding:12px;border-radius:12px;margin:8px 0;text-align:left;background:#fff;cursor:pointer;font-size:15px}
.opt label.selected
